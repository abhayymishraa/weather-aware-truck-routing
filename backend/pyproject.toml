[project]
name = "backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
authors = [
    { email = "grabhaymishra@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "polyline>=2.0.4",
    "redis>=8.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
